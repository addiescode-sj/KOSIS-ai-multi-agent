# The operator app's own migrations (admin schema only, T3-57). Separate from the service's alembic.ini:
#   alembic -c admin/alembic.ini upgrade head     (as kosis_admin, ADMIN_DATABASE_URL)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/.. %(here)s/../src
path_separator = space

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
