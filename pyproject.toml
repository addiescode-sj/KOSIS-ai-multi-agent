[project]
name = "kosis-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Backend
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    # AI workflow (HCX through langchain-naver)
    "langgraph>=1.2,<2",
    "langchain-core>=1.7.0",
    "langchain-naver>=0.1.1",
    # gpt-4o-mini: the multi-turn follow-up reader and multi-query split LLM step (INTERPRETER_MODEL default),
    # and phase 1 on STAT_PROVIDER=openai | gemma for model comparisons (src/kosis_agent/services/openai_stat.py)
    "openai>=3.3.0",
    "langchain-openai>=1.7.3",
    # Phase 1 runtime (vendor/phase1/requirements.txt)
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Phase 2 runtime (vendor/phase2/pyproject.toml)
    "rank-bm25>=0.2.2",
    "chromadb-client==1.5.9",
    # Data: conversation history and eval results (PostgreSQL), cache / session / job queue (Redis)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    # Observability
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.4.0",
    "pytest>=8.0",
]
# Query embedder / reranker of the phase 2 search (CPU torch, large): uv sync --group embed
embed = [
    "sentence-transformers",
    # Listed only to pin its index below (no CUDA wheels in the Linux image)
    "torch",
]
# Async answer-quality eval (KOS-82, KOS-116): uv sync --group ragas
ragas = [
    "ragas",
]

[tool.uv]
package = false

# Linux (the Docker image) takes the CPU build; macOS wheels from PyPI are CPU/MPS already
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
