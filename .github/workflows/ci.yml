name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # vendor/phase1, vendor/phase2 (not recursive: phase 2's own phase1 copy is not needed)
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --frozen
      - run: npm ci && (cd frontend && npm ci)
      - run: bash scripts/verify.sh

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: docker build -f backend/Dockerfile -t kosis-agent-backend .
      - run: docker build -t kosis-agent-frontend frontend
