name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # vendor/phase1, vendor/phase2 (not recursive: phase 2's own phase1 copy is not needed)
          fetch-depth: 0 # the quality record check below diffs against the PR base
      # T3-19: CI cannot run the evals (no data, golden sets or keys here), so the quality gate (tests/test_quality_gate.py,
      # inside verify.sh) compares the committed ragas record with the committed baseline. Warn when a PR changes the
      # pipeline without a new record: the gate then has nothing new to compare.
      - name: Quality record present for pipeline changes
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if echo "$changed" | grep -qE '^(src/|backend/|vendor/)' && ! echo "$changed" | grep -qx 'evals/reports/quality_history.jsonl'; then
            echo "::warning::Pipeline code changed without a new ragas record. Run e2e then 'python -m evals.run_eval --layer ragas --from-run <e2e run>' and commit evals/reports/quality_history.jsonl."
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --frozen
      - run: npm ci && (cd frontend && npm ci)
      - run: bash scripts/verify.sh

  images:
    runs-on: ubuntu-latest
    needs: verify
    # T3-59: a PR only checks that the three images build; a push to main also stores them in GHCR as sha-<commit>.
    # Deploying is outside this repo (kosis-infra): the server deploys main's newest commit only when all three exist.
    permissions:
      contents: read
      packages: write # used only on a push to main (login below)
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Image names
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kosis-agent" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      # Built into the local docker (load) so the check below sees exactly what is pushed. One cache scope per image
      # (mode=min: the backend carries CPU torch until the deploy build lands, and the repo cache is capped at 10 GB).
      # WITH_EMBED=0: the deployed backend calls the GPU inference servers (EMBED_URL/RERANK_URL) instead of loading
      # the models; main's Dockerfile ignores it until that build arg lands. docker-compose builds are unaffected.
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: backend
          build-args: WITH_EMBED=0
          load: true
          tags: ${{ env.IMG }}-backend:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min
      - name: Build migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: migrate
          load: true
          tags: ${{ env.IMG }}-migrate:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=migrate
            type=gha,scope=backend
          cache-to: type=gha,scope=migrate,mode=min
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.IMG }}-frontend:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=min
      # The operator app (admin/) is built here only to check it builds; it is not pushed yet.
      - name: Build admin
        run: docker build -f admin/Dockerfile -t kosis-admin .
      # Provided data and keys must never be in an image (the images are public). The checkout has neither, so this
      # guards against a future COPY or a committed file.
      - name: No data or keys in the images
        run: |
          for name in backend migrate frontend; do
            docker run --rm --entrypoint sh "$IMG-$name:$TAG" -c '
              for d in /app/data /app/vendor/*/data; do
                if [ -e "$d" ]; then echo "$d"; exit 1; fi
              done
              found=$(find /app \( -name .venv -o -name node_modules \) -prune -o -name ".env*" ! -name .env.example -print)
              if [ -n "$found" ]; then echo "$found"; exit 1; fi
            ' || { echo "::error::$name image contains provided data or a key file (above)"; exit 1; }
          done
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: env.PUSH == 'true'
        run: for name in backend migrate frontend; do docker push --quiet "$IMG-$name:$TAG"; done
