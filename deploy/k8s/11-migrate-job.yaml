# DB 표 만들기(alembic upgrade head). 60-deploy.sh 가 배포할 때마다 앱보다 먼저 지우고 다시 만든다.
# 손으로: kubectl -n kosis delete job migrate; sed "s#image: kosis/migrate#image: ghcr.io/addiescode-sj/kosis-agent-migrate:sha-<커밋>#" 11-migrate-job.yaml | kubectl -n kosis apply -f -
apiVersion: batch/v1
kind: Job
metadata: { name: migrate }
spec:
  backoffLimit: 6                          # postgres 준비 전이면 재시도
  template:
    spec:
      securityContext: { appArmorProfile: { type: Localhost, localhostProfile: kosis-app } }   # 12-apparmor.sh
      restartPolicy: OnFailure
      initContainers:                        # DB가 준비될 때까지 기다림
        - name: wait-db
          image: pgvector/pgvector:0.8.1-pg17
          command: [sh, -c, "until pg_isready -h postgres -t 2; do sleep 2; done"]
      containers:
        - name: migrate
          image: kosis/migrate
          imagePullPolicy: IfNotPresent    # GHCR 이미지. 60-deploy.sh 가 태그를 넣어 적용
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: kosis-env, key: DATABASE_URL } }
