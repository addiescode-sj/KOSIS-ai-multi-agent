# 입구. HTTPS 주소(<사이트 주소>, node-1 고정 IP의 sslip.io 이름)로만 서비스, http 나 IP 로 오면 HTTPS 로 보냄. 실제 주소는 deploy/overlay
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kosis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  rules:
    - host: kosis.example.invalid
      http:
        paths:
          # 운영자 화면 /admin 은 프론트(React, T3-67)가 그린다. 운영자 앱(32-admin.yaml)은 데이터 창구 /admin/api 와
          # 이전 화면 /admin/classic(QA 뒤 삭제)만 받는다. 긴 경로가 먼저 맞음
          - path: /admin/api
            pathType: Prefix
            backend: { service: { name: kosis-admin, port: { number: 8100 } } }
          - path: /admin/classic
            pathType: Prefix
            backend: { service: { name: kosis-admin, port: { number: 8100 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: to-https }
spec:
  redirectRegex:
    regex: "^http://[^/]+/(.*)"
    replacement: "https://kosis.example.invalid/${1}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kosis-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kosis-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
