[pytest]
# This repo's tests only; vendor/phase1 and vendor/phase2 keep their own tests and conftest
testpaths = tests
# `.`: backend, evals (copied from phase 2) · src: kosis_agent · phase 2: kosis_rag · phase 1: eval, kosis_chat, kosis_ai
pythonpath = . src vendor/phase2/src vendor/phase1 vendor/phase1/src
addopts = -q
markers =
    offline: runs without the provided data in data/
    postgres: needs TEST_DATABASE_URL (a throwaway PostgreSQL); skipped otherwise, e.g. in CI
