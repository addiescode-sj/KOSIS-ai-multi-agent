<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOSIS 챗봇 데모</title>
<!-- 그래프: Vega-Lite v5 (실전 1 to_vega가 만드는 spec과 같은 버전). CDN을 못 읽으면 답 문장만 보인다. -->
<script defer src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script defer src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script defer src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #e1e5eb; --text: #1b2230; --muted: #667085;
    --accent: #2f6db5; --ok: #1f7a4d; --warn: #a15c00; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; white-space: nowrap; }
  #info { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  #inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .hint { color: var(--muted); text-align: center; margin-top: 18vh; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .row.user .bubble { max-width: 80%; background: var(--accent); border-color: var(--accent); color: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.bot .bubble { width: 100%; }
  .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--err); white-space: pre-wrap; overflow-wrap: anywhere; }
  .status, .steps { color: var(--muted); font-size: 12.5px; }
  .steps { margin-top: 6px; }
  .chart { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; background: #fff; }
  .chart.note { color: var(--muted); font-size: 13px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .meta a, .cands a { color: var(--accent); }
  .badge { padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font-weight: 600; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.err { color: var(--err); }
  .warn-text { color: var(--warn); }
  .more { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .more > summary { cursor: pointer; }
  .cands { margin: 6px 0 0; padding-left: 22px; color: var(--text); }
  .cands li { margin: 2px 0; }
  .cands .sub { color: var(--muted); }
  .cands .tag { margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .cands li.used .tag.used { color: var(--ok); border-color: var(--ok); }
  pre { max-height: 320px; overflow: auto; margin: 6px 0 0; padding: 8px; background: var(--bg); border-radius: 8px; color: var(--text); font-size: 12px; }
  #form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  #form .wrap { display: flex; gap: 8px; width: 100%; max-width: 880px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; max-height: 140px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; color: var(--text); background: #fff;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body>
<header>
  <h1>KOSIS 챗봇 데모</h1>
  <span id="info"></span>
  <button id="reset" type="button" title="대화 맥락(직전 표)을 지우고 새로 시작">새 대화</button>
</header>
<div id="log"><div id="inner"></div></div>
<form id="form">
  <div class="wrap">
    <textarea id="q" rows="1" placeholder="질문을 입력하세요. 예: 2023년 시도별 출생아 수 (Enter 전송, Shift+Enter 줄바꿈)" autofocus></textarea>
    <button id="send" class="primary" type="submit">보내기</button>
  </div>
</form>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log"), inner = $("inner"), form = $("form"), input = $("q"), sendBtn = $("send");

const OUTCOME = { answered: ["답함", "ok"], refused: ["거절", "warn"], clarify: ["되묻기", "warn"], failed: ["실패", "err"] };
const STEP = {
  parse: "질문 해석", condition: "조건", retrieve_bm25: "BM25", retrieve_dense: "임베딩 검색", retrieve: "검색",
  fuse: "합치기", rerank1: "1차 리랭커", rerank2: "2차 리랭커", gate: "판정", stat: "수치 요약",
};
const HINT = "질문을 보내면 표 검색, 수치 요약, 그래프 순서로 답합니다.";

let threadId = newId();
let busy = false;

function newId() {
  return (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random()).replace(/[^0-9a-z]/gi, "");
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function link(text, url) {
  if (typeof url !== "string" || !/^https?:\/\//.test(url)) return el("span", "", text);
  const a = el("a", "", text);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}

function toBottom() { log.scrollTop = log.scrollHeight; }

function addBubble(role) {
  const hint = inner.querySelector(".hint");
  if (hint) hint.remove();
  const row = el("div", "row " + role), bubble = el("div", "bubble");
  row.appendChild(bubble);
  inner.appendChild(row);
  toBottom();
  return bubble;
}

function seconds(value) { return typeof value === "number" ? value.toFixed(1) : "?"; }

function stepsText(steps) {
  return steps.map((s) => (STEP[s.name] || s.name) + " " + seconds(s.seconds)).join(" → ");
}

// text/event-stream 본문을 {event, data}로 나눈다 (서버는 event + data 한 줄씩만 보낸다)
async function* readEvents(body) {
  const reader = body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (value) buffer += decoder.decode(value, { stream: true });
    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      let event = "message";
      const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      if (data.length) yield { event, data: data.join("\n") };
    }
    if (done) break;
  }
}

function drawChart(bubble, spec) {
  const box = el("div", "chart"), target = el("div");  // vega-embed는 target에 자기 클래스를 붙인다. 테두리·가로 스크롤은 box가 맡는다
  box.appendChild(target);
  bubble.appendChild(box);
  if (!window.vegaEmbed) {
    box.classList.add("note");
    box.textContent = "그래프 라이브러리(vega-embed)를 불러오지 못해 그래프를 그리지 못했습니다. 인터넷 연결을 확인하세요.";
    return;
  }
  // editor(외부 Vega 편집기로 데이터 전송)는 끈다. 내보내기(PNG/SVG)와 spec 보기만 둔다.
  window.vegaEmbed(target, spec, { renderer: "svg", actions: { export: true, source: true, compiled: false, editor: false } })
    .then(toBottom)
    .catch((error) => {
      box.classList.add("note");
      box.textContent = "그래프를 그리지 못했습니다: " + error;
    });
}

function renderSteps(bubble, steps, total) {
  if (!steps.length && typeof total !== "number") return;
  const parts = [];
  if (steps.length) parts.push("단계(초): " + stepsText(steps));
  if (typeof total === "number") parts.push("전체 " + seconds(total) + "초");
  bubble.appendChild(el("div", "steps", parts.join(" · ")));
}

function renderResult(bubble, r, steps) {
  bubble.textContent = "";
  bubble.appendChild(el("div", "answer", r.answer || "(답 문장이 비어 있습니다)"));
  if (r.chart) drawChart(bubble, r.chart);

  const picked = r.picked || [], candidates = r.candidates || [];
  const order = [];  // 실전 1에 넘기는 순서: 고른 표 다음 나머지 후보 (main_graph candidate_keys와 같음)
  for (const c of [...picked, ...candidates]) if (!order.some((o) => o.key === c.key)) order.push(c);
  const pickedKeys = new Set(picked.map((c) => c.key));
  const used = r.table_key ? order.find((c) => c.key === r.table_key) : null;

  const meta = el("div", "meta");
  const [label, cls] = OUTCOME[r.outcome] || [r.outcome || "?", "warn"];
  meta.appendChild(el("span", "badge " + cls, label));
  if (r.table_key) {
    const span = el("span", "", "사용한 표: ");
    span.appendChild(link(used ? used.survey_name + " / " + used.table_name : r.table_key, used && used.url));
    span.appendChild(document.createTextNode(" (" + r.table_key + ")" + (r.reused_table ? " · 직전 표 다시 사용" : "")));
    meta.appendChild(span);
  }
  if (r.no_answer_reason) meta.appendChild(el("span", "", "이유: " + r.no_answer_reason));
  if (r.degraded) meta.appendChild(el("span", "warn-text", "2차 리랭커 실패: 1차 순서로 답함"));
  if ((r.attempted_keys || []).length > 1) meta.appendChild(el("span", "", "시도한 표: " + r.attempted_keys.join(", ")));
  bubble.appendChild(meta);
  renderSteps(bubble, steps, r.seconds);

  if (order.length) {
    const box = el("details", "more");
    box.appendChild(el("summary", "", "후보 표 " + order.length + "개"));
    const list = el("ol", "cands");
    for (const c of order) {
      const item = el("li", c.key === r.table_key ? "used" : "");
      item.appendChild(link(c.table_name || c.key, c.url));
      const score = c.score == null ? "" : " · " + Number(c.score).toFixed(3);
      item.appendChild(el("span", "sub", " " + [c.survey_name, c.period, c.key].filter(Boolean).join(" · ") + score));
      if (pickedKeys.has(c.key)) item.appendChild(el("span", "tag", "고름"));
      if (c.key === r.table_key) item.appendChild(el("span", "tag used", "사용"));
      list.appendChild(item);
    }
    box.appendChild(list);
    bubble.appendChild(box);
  }
  const raw = el("details", "more");
  raw.appendChild(el("summary", "", "원본 응답 (JSON)"));
  raw.appendChild(el("pre", "", JSON.stringify(r, null, 2)));
  bubble.appendChild(raw);
  toBottom();
}

function renderError(bubble, message, steps, total) {
  bubble.textContent = "";
  bubble.appendChild(el("div", "error", "오류: " + message));
  renderSteps(bubble, steps || [], total);
  toBottom();
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  $("reset").disabled = value;
}

async function ask(question) {
  setBusy(true);
  addBubble("user").textContent = question;
  const bubble = addBubble("bot");
  const status = el("div", "status", "표를 찾는 중 ...");
  bubble.appendChild(status);
  const steps = [];
  const started = performance.now();
  const tick = () => {
    const waited = Math.round((performance.now() - started) / 1000);
    status.textContent = (steps.length ? stepsText(steps) + " → " : "") + "진행 중 ... " + waited + "초";
  };
  const timer = setInterval(tick, 500);
  let finished = false;
  try {
    const response = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, thread_id: threadId }),
    });
    if (!response.ok || !response.body) throw new Error("HTTP " + response.status + " " + (await response.text()));
    for await (const event of readEvents(response.body)) {
      const data = JSON.parse(event.data);
      if (event.event === "step") { steps.push(data); tick(); toBottom(); }
      else if (event.event === "result") { finished = true; renderResult(bubble, data, steps); }
      else if (event.event === "error") { finished = true; renderError(bubble, data.type + ": " + data.detail, steps, data.seconds); }
    }
    if (!finished) renderError(bubble, "응답이 끝나기 전에 연결이 끊겼습니다. 서버 창의 로그를 확인하세요.", steps);
  } catch (error) {
    if (!finished) renderError(bubble, "서버에 닿지 못했습니다 (" + error + "). serve.py가 떠 있는지 확인하세요.", steps);
    else console.error(error);
  } finally {
    clearInterval(timer);
    setBusy(false);
    input.focus();
  }
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight + 2, 140) + "px";
}

function showHint() {
  inner.textContent = "";
  inner.appendChild(el("div", "hint", HINT));
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question || busy) return;
  input.value = "";
  autosize();
  ask(question);
});
input.addEventListener("input", autosize);
input.addEventListener("keydown", (event) => {
  // 한글 조합 중의 Enter는 보내지 않는다 (글자가 두 번 들어가는 문제)
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    form.requestSubmit();
  }
});
$("reset").addEventListener("click", () => {
  if (busy) return;
  threadId = newId();
  showHint();
  input.focus();
});

showHint();
fetch("/info").then((r) => r.json()).then((info) => {
  const parts = [
    info.collection && "컬렉션 " + info.collection,
    info.stage2 && "2차 " + info.stage2 + (info.stage2_model ? " (" + info.stage2_model + ")" : ""),
    info.stat && "수치 요약 " + info.stat,
    info.max_rows ? "표 한도 " + Number(info.max_rows).toLocaleString() + "행" : "표 한도 없음",
  ].filter(Boolean);
  $("info").textContent = parts.join(" · ");
  $("info").title = JSON.stringify(info, null, 1);
}).catch(() => {});
</script>
</body>
</html>
