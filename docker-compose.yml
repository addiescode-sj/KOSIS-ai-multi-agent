services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    env_file:
      # Optional: /health and the stack come up without keys; /chat/stream needs HCX_API_KEY (503 otherwise)
      - path: .env
        required: false
    environment:
      # Inside compose services are reached by name; .env holds the host-side addresses.
      # One PostgreSQL holds the conversations (KOS-86) and the vector store (pgvector, T3-47; was the chroma service).
      # T3-51: also the conversation state (LangGraph checkpoints), sessions and feedback; no Redis (11/08 decision)
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD:-kosis}@postgres:5432/${POSTGRES_DB:-kosis}
      # Phase 1 finds a table key in <root>/data/tables.csv; phase 2 paths come from backend/app/config.py (<root>/data)
      KOSIS_WORKSPACE: /app
    volumes:
      # Provided data stays outside the image (security pledge). Both modules read it under /app/data.
      # EMBED_CKPT / RERANK_CKPT in .env must be container paths here, e.g. data/models/<file>.pt (cwd /app)
      - ./data:/app/data:ro
      # Embedding model weights, downloaded on the first search and kept across restarts
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # tables exist before the API starts (T3-18)
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # slim image has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    # Conversation history and eval results (KOS-86), and the vector store (T3-47: pgvector, tables by alembic 0003_pgvector).
    # Was postgres:17-alpine: a volume made by that image is musl-collated; recreate it (plans/T3-47.md).
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosis}
      POSTGRES_DB: ${POSTGRES_DB:-kosis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the default password is for local development (T3-18)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kosis} -d ${POSTGRES_DB:-kosis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # One-shot: alembic upgrade head on the postgres service, then exits (T3-18). Rerun after adding a migration:
    # docker compose run --rm migrate
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD:-kosis}@postgres:5432/${POSTGRES_DB:-kosis}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  jaeger:
    # Node and internal API spans: UI http://localhost:16686, OTLP gRPC :4317.
    # Optional: docker compose --profile obs up -d jaeger
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["obs"]
    ports:
      - "16686:16686"
      - "4317:4317"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  hf-cache:
